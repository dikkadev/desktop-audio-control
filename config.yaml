portName: "COM11"
baudRate: 115200
combos:
  - combo: 0
    deviceName: "SteelSeries Sonar Gaming"
  - combo: 1
    deviceName: "SteelSeries Sonar Chat"
  - combo: 2
    deviceName: "SteelSeries Sonar Media"
  - combo: 3
    deviceName: "SteelSeries Sonar Aux"
  - combo: 4
    deviceName: "Bose NC 700 Headphones"
    fallbackNames: ["Realtek Speakers", "Speakers Realtek"]
configReloadPeriod: 10m
setEventPeriod: 5s

# Device Matching Vocabulary Configuration
# =======================================
# Define the vocabulary used for semantic device matching.
# Order matters as each term becomes a dimension in the feature vector.
# Terms are matched case-insensitively and support partial substring matching.
# 
# If not specified, a sensible default vocabulary will be used.
# You can customize this list based on your specific audio devices.
deviceMatchingVocabulary:
  # Brand names
  - "steelseries"
  - "realtek"
  - "bose"
  - "logitech"
  - "corsair"
  
  # Product series/lines
  - "sonar"
  - "arctis"
  - "nc"
  - "700"
  - "astro"
  
  # Device types
  - "gaming"
  - "chat"
  - "media"
  - "aux"
  - "microphone"
  - "speakers"
  - "headphones"
  - "headset"
  
  # Audio descriptors
  - "audio"
  - "playback"
  - "output"
  - "input"
  - "surround"
  - "stereo"
  
  # Connection types
  - "usb"
  - "wireless"
  - "bluetooth"
  - "analog"

